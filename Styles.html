<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; font-size: 13px; color: #202124; margin: 0; padding: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 3px; color: #3c4043; }
  .req { color: #d93025; }
  input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid #c4c7c5; border-radius: 6px;
    font-size: 13px; background: #fff; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #1a73e8; border-color: #1a73e8; }
  input[readonly] { background: #f1f3f4; color: #5f6368; }
  .ro { background: #f1f3f4; padding: 7px 8px; border-radius: 6px; min-height: 31px; color: #3c4043; }
  .actions { margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end; }
  .btn { padding: 8px 18px; border: 0; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #1a4e8a; color: #fff; }
  .btn-primary:disabled { background: #9aa9bd; cursor: default; }
  .btn-light { background: #e8eaed; color: #3c4043; }
  .msg { margin-top: 10px; padding: 8px 10px; border-radius: 6px; display: none; font-size: 12.5px; }
  .msg.err { background: #fce8e6; color: #b3261e; display: block; }
  .msg.ok { background: #e6f4ea; color: #137333; display: block; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center;
    justify-content: center; z-index: 10; }
  .overlay.show { display: flex; }
  .panel { background: #fff; border-radius: 10px; padding: 16px; width: 92%; max-width: 440px; }
  .panel h3 { margin: 0 0 12px; color: #1a4e8a; }
  .hint { font-size: 11.5px; color: #5f6368; margin-top: 3px; }
</style>
